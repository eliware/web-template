version: "14.0"
description: Guidance for the Eliware web application template.
directives:
  - id: E-1020.0
    dos:
      - Provide a Node.js web application template with public assets and documented routes.
      - Provide a tested browser build, focused tests, and a GHCR image baseline.
      - Replace the template name, page, routes, and package metadata in a derived application.
    donts:
      - Do not publish the template name or placeholder page as a finished application.
